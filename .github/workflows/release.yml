name: release

# Publishes to PyPI via Trusted Publishing (OIDC) — no long-lived token.
# The PyPI project `character-factory` must have this repository +
# workflow registered as a trusted publisher. Trigger: publishing a
# GitHub release whose tag is `v<version>` matching pyproject.toml.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches the package version
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"release tag {tag!r} does not match pyproject version {version!r}")
          if ".dev" in version:
              sys.exit(f"refusing to release a dev version ({version})")
          EOF
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke the wheel (schema/assemble surface, no extras)
        run: |
          python -m pip install dist/*.whl
          python -c "import character_factory; print(character_factory.__version__)"
          character-factory validate examples/characters/*.char.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write     # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
