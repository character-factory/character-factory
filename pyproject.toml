[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "character-factory"
version = "0.1.1"
description = "Turn a text description into a rigged, textured, realtime 3D human."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["3d", "character", "avatar", "gltf", "generative"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# Base = everything the assembly-only story needs (ARCHITECTURE.md §6.2):
# torch runs the rig's TorchScript forward on CPU, numpy does the mesh math.
# The schema and registry modules remain stdlib-only in what they import.
# Generation-only dependencies live in the [generation] extra.
# scipy/trimesh/pygltflib serve the vendored hair engine — pure-Python or
# wheels-everywhere, so hair synthesis stays CPU-capable on every platform.
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pillow>=10",
  "scipy>=1.10",
  "trimesh>=4.0",
  "rtree>=1.0",
  "pygltflib>=1.16",
]

[project.scripts]
character-factory = "character_factory.cli:main"

[project.optional-dependencies]
# Generation (identity, textures, interpreter) is GPU territory: Linux+CUDA
# first-class, WSL2 supported. The base install stays dependency-free so the
# schema tools, registry, and assembler-only flows work everywhere.
generation = [
  "transformers>=5.5",
  "diffusers>=0.35",
  "safetensors>=0.4",
  "lm-format-enforcer>=0.10",
  # diffusers' LoRA load/unload path imports both at adapter time — they
  # are required, not optional, for every bake.
  "peft>=0.15",
  "accelerate>=1.0",
]
server = ["fastapi>=0.111", "uvicorn>=0.30", "anyio>=4"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "jsonschema>=4.21", "httpx>=0.27", "fastapi>=0.111", "anyio>=4"]

[project.urls]
Homepage = "https://characterfactory.ai"
Repository = "https://github.com/character-factory/character-factory"
Documentation = "https://github.com/character-factory/character-factory#readme"
Issues = "https://github.com/character-factory/character-factory/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"character_factory.schema" = ["data/*.json"]
"character_factory.assembly" = ["data/*.json"]
"character_factory.registry" = ["data/*.json"]
"character_factory.hair.wig.schemas" = ["*.json"]
"character_factory.server" = ["static/*.html"]
"character_factory" = ["assets/textures/generated/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
