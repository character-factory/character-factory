[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "character-factory"
version = "0.1.0.dev0"
description = "Turn a text description into a rigged, textured, realtime 3D human."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["3d", "character", "avatar", "gltf", "generative"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# The schema module is deliberately dependency-free (stdlib only) so that
# validating and editing character files works on any machine that can run
# Python. Generation and assembly dependencies arrive with their modules.
dependencies = []

[project.optional-dependencies]
# Generation (identity, textures, interpreter) is GPU territory: Linux+CUDA
# first-class, WSL2 supported. The base install stays dependency-free so the
# schema tools, registry, and assembler-only flows work everywhere.
generation = [
  "torch>=2.4",
  "transformers>=4.44",
  "safetensors>=0.4",
  "numpy>=1.26",
  "lm-format-enforcer>=0.10",
]
dev = ["pytest>=8", "jsonschema>=4.21"]

[project.urls]
# Homepage/repository URLs land when the public repository exists.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"character_factory.schema" = ["data/*.json"]
"character_factory.registry" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
