<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>character-factory</title>
<style>
/* Gallery-first shell: the library IS the page, the controls are a floating
   dock, one character opens as a lightbox (3D orbit + detail rail). A plain
   client of the /v0 contract — no local-only endpoints. */
:root {
  --bg: #131512; --bar: #1b211e; --tile: #1a1f1c; --lb: #0c0e0d;
  --line: rgba(246,252,249,.09); --line-hard: rgba(246,252,249,.16);
  --fill: rgba(246,252,249,.06);
  --text: #e8efeb; --dim: rgba(232,239,235,.55); --faint: rgba(232,239,235,.35);
  --accent: #4a79e8; --accent-soft: rgba(74,121,232,.22);
  --good: #79c98c; --warn: #d8a55a; --bad: #e6665c;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100dvh; overflow: hidden;
  overscroll-behavior: none; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--sans); }
body { display: flex; flex-direction: column; }
.mono { font-family: var(--mono); font-size: 12px; }
.dim { color: var(--dim); }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--fill); color: var(--text); padding: 6px 14px; }
button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }

/* topbar */
.topbar { display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--line); flex: none; }
.brand { font-weight: 650; letter-spacing: -.01em; }
.brand .mono { margin-left: 10px; color: var(--dim); }

/* gallery */
.gallery-wrap { flex: 1; overflow-y: auto; padding: 16px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px; padding-bottom: 140px; }
.tile { position: relative; aspect-ratio: 3 / 4; border-radius: 12px;
  background: var(--tile) center/cover no-repeat; border: 1px solid var(--line);
  cursor: pointer; overflow: hidden; }
.tile:hover { border-color: var(--line-hard); }
.tile-meta { position: absolute; inset: auto 0 0 0; padding: 24px 9px 7px;
  font-size: 12px; color: var(--text);
  background: linear-gradient(transparent, rgba(0,0,0,.72));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-badge { position: absolute; top: 8px; left: 8px; padding: 2px 9px;
  border-radius: 999px; font-size: 11px; background: rgba(0,0,0,.55);
  border: 1px solid var(--line-hard); }
.tile-badge.error { color: var(--bad); }
.tile-badge.working { color: var(--warn); }
.tile.pending { display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-size: 12px; }
.gallery-empty { text-align: center; color: var(--dim); margin-top: 14vh; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex;
  justify-content: center; padding: 0 16px 18px; pointer-events: none; }
.bar { pointer-events: auto; width: min(760px, 100%); background: var(--bar);
  border: 1px solid var(--line-hard); border-radius: 16px; padding: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,.45); }
.bar-row { display: flex; gap: 8px; align-items: flex-end; }
.bar textarea { flex: 1; resize: none; background: transparent; border: 0;
  outline: none; color: var(--text); font: inherit; max-height: 7em; padding: 6px 4px; }
.chip-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.chip { display: flex; gap: 6px; align-items: center; font-size: 12px;
  color: var(--dim); background: var(--fill); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; }
.chip select { background: transparent; color: var(--text); border: 0;
  outline: none; font: inherit; font-size: 12px; }
.chip select option { background: var(--bar); }
.bar-note { font-size: 12px; color: var(--dim); min-height: 16px; margin-left: auto; }

/* lightbox */
.lightbox { position: fixed; inset: 0; background: var(--lb); display: flex; z-index: 30; }
.lb-stage { flex: 1; position: relative; min-width: 0; }
.lb-stage canvas { display: block; }
.lb-close { position: absolute; top: 12px; left: 12px; z-index: 2; }
.lb-info { position: absolute; top: 12px; right: 12px; z-index: 2; }
.lb-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  color: var(--faint); }
.lb-spinner { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px;
  margin: -21px 0 0 -21px; border: 3px solid var(--line);
  border-top-color: var(--accent); border-radius: 50%; z-index: 1;
  animation: lbspin .9s linear infinite; }
@keyframes lbspin { to { transform: rotate(360deg); } }
/* The detail rail is hidden by default (toggled by the ⓘ button); on
   narrow screens it overlays the stage instead of squeezing it away. */
.lb-rail { width: 330px; flex: none; border-left: 1px solid var(--line);
  padding: 14px; display: none; flex-direction: column; gap: 10px;
  overflow-y: auto; background: var(--bg); }
.lightbox.rail-open .lb-rail { display: flex; }
@media (max-width: 700px) {
  .lb-rail { position: absolute; top: 0; right: 0; bottom: 0;
    width: min(330px, 88vw); z-index: 4; box-shadow: -12px 0 30px rgba(0,0,0,.5); }
}
.lb-prompt { color: var(--dim); font-size: 13px; margin: 0; }
.lb-textures { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lb-textures figure { margin: 0; text-align: center; }
.lb-textures img { width: 100%; aspect-ratio: 1; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--line); background: #000; }
.lb-textures figcaption { font-size: 11px; color: var(--dim); margin-top: 2px; }
.lb-flex { flex: 1; }
.lb-actions { display: flex; flex-direction: column; gap: 8px; }
.lb-actions a { text-align: center; text-decoration: none; color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px;
  background: var(--fill); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">character-factory
    <span class="mono" id="worker-status">connecting…</span></div>
  <div class="mono dim"><span id="library-count"></span>
    <a href="/v0/docs" style="color: inherit; margin-left: 12px;">API docs</a></div>
</header>

<main class="gallery-wrap">
  <div class="gallery" id="grid"></div>
  <div class="gallery-empty" id="empty" hidden>
    <h2>Nothing here yet</h2>
    <p>Describe a character below and create. They land here as they build.</p>
  </div>
</main>

<div class="dock"><div class="bar">
  <div class="bar-row">
    <textarea id="prompt" rows="1"
      placeholder="a tall athletic woman with long wavy red hair and green eyes, wearing a navy tank top and black leggings"></textarea>
    <button class="primary" id="create">Create</button>
  </div>
  <div class="chip-row">
    <label class="chip">writer
      <select id="interpreter"><option value="">auto</option></select>
    </label>
    <label class="chip" title="Bake textures on the fast distilled base — speed over fidelity">
      <input type="checkbox" id="turbo"> turbo
    </label>
    <span class="bar-note" id="note"></span>
  </div>
</div></div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-stage" id="stage">
    <button class="lb-close" id="lb-close">✕ close</button>
    <button class="lb-info" id="lb-info">ⓘ details</button>
    <div class="lb-spinner" id="lb-spinner" hidden></div>
    <div class="lb-hint mono">drag to orbit · scroll to zoom</div>
  </div>
  <aside class="lb-rail">
    <div class="mono" id="lb-id"></div>
    <div class="mono dim" id="lb-status"></div>
    <div class="mono dim" id="lb-created"></div>
    <p class="lb-prompt" id="lb-prompt"></p>
    <div class="mono dim" id="lb-writer"></div>
    <details open><summary class="mono dim">generated UV maps</summary>
      <div class="lb-textures" id="lb-textures"></div></details>
    <div class="lb-flex"></div>
    <div class="lb-actions">
      <a id="lb-download" download>Download scene.glb</a>
      <button id="lb-regenerate">Regenerate (re-bake textures)</button>
      <button id="lb-reassemble">Reassemble</button>
      <button class="danger" id="lb-delete">Delete</button>
    </div>
  </aside>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const SLOTS = ['skin', 'garment', 'shoe', 'eye'];

let rows = [], jobs = [], open = null, openRevision = -1;

/* ------------------------------------------------------------- selector */
fetch('/v0/interpreters').then(r => r.json()).then(list => {
  for (const {alias, kind} of list) {
    const option = document.createElement('option');
    option.value = alias;
    option.textContent = kind === 'rules' ? `${alias} (fallback)` : alias;
    $('interpreter').appendChild(option);
  }
}).catch(() => {});

/* --------------------------------------------------------------- gallery */
function tile(row) {
  const div = document.createElement('div');
  const job = row.latest_job;
  const working = job && ['queued', 'running', 'cancelling'].includes(job.status);
  const failed = job?.status === 'failed';
  if (row.artifact.available || failed || working) {
    div.className = 'tile';
    // The rendered portrait, written by the server when assembly completes
    // (a 404 for not-yet-thumbnailed characters just leaves the tile card).
    div.style.backgroundImage =
      `url(/v0/characters/${row.id}/thumbnail.png?rev=${row.artifact.revision})`;
  } else {
    div.className = 'tile pending';
    div.textContent = 'stored';
  }
  const badge = failed
    ? `<span class="tile-badge error" title="${esc(job.error?.message)}">error</span>`
    : working ? `<span class="tile-badge working">${esc(job.stage)}</span>` : '';
  div.insertAdjacentHTML('beforeend',
    `${badge}<span class="tile-meta">${esc(row.name || row.id)}</span>`);
  div.onclick = () => openLightbox(row.id);
  return div;
}

async function refresh() {
  try {
    [rows, jobs] = await Promise.all([
      fetch('/v0/characters').then(r => r.json()),
      fetch('/v0/jobs').then(r => r.json()),
    ]);
  }
  catch { $('worker-status').textContent = 'server unreachable'; return; }
  const busy = jobs.find(j => ['queued', 'running', 'cancelling'].includes(j.status));
  $('worker-status').textContent = busy
    ? `${busy.stage}: job ${busy.id.slice(0, 8)}` : 'idle';
  $('library-count').textContent = rows.length ? `${rows.length} characters` : '';
  const grid = $('grid');
  grid.replaceChildren(...rows.map(tile));
  $('empty').hidden = rows.length > 0;
  if (open) {
    const row = rows.find(r => r.id === open);
    if (row) {
      const job = row.latest_job;
      $('lb-status').textContent = job
        ? job.stage + (job.detail ? ` — ${job.detail}` : '')
        : row.artifact.available ? 'ready' : 'stored';
      if (row.artifact.available && row.artifact.revision !== openRevision) loadScene(row);
    }
  }
}
setInterval(refresh, 1500); refresh();

/* ---------------------------------------------------------------- create */
$('create').onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) return;
  const body = { prompt };
  if ($('interpreter').value) body.interpreter = $('interpreter').value;
  if ($('turbo').checked) body.turbo = true;
  $('create').disabled = true;
  $('note').textContent = 'creating (the writer and identity run first)…';
  try {
    const response = await fetch('/v0/characters', { method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    const record = await response.json();
    $('note').textContent = response.ok ? `queued job ${record.id}`
                                        : (record.error || record.detail || 'failed');
  } catch (error) { $('note').textContent = String(error); }
  $('create').disabled = false;
  refresh();
};

/* -------------------------------------------------------------- lightbox */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0e0d);
scene.environment = new THREE.PMREMGenerator(renderer)
  .fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.GridHelper(3, 12, 0x3a3f47, 0x22252b));
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
camera.position.set(1.3, 1.5, 2.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
let mixer = null, model = null;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if ($('lightbox').hidden) return;
  if (mixer) mixer.update(clock.getDelta());
  controls.update(); renderer.render(scene, camera);
});
function resize() {
  const stage = $('stage');
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('stage'));

// Never show the previously loaded character while a new one downloads:
// the stage is cleared immediately and a spinner holds it until the right
// scene arrives (the token drops loads that finish out of order).
let loadToken = 0;
function clearStage(spinning) {
  if (model) { scene.remove(model); model = null; }
  mixer = null;
  $('lb-spinner').hidden = !spinning;
}
function loadScene(row) {
  openRevision = row.artifact.revision;
  const token = ++loadToken;
  clearStage(true);
  new GLTFLoader().load(`/v0/characters/${row.id}/scene.glb?rev=${row.artifact.revision}`, g => {
    if (token !== loadToken || open !== row.id) return;   // stale load
    model = g.scene; scene.add(model);
    mixer = new THREE.AnimationMixer(model);
    g.animations.forEach(c => mixer.clipAction(c).play());  // the baked idle
    $('lb-spinner').hidden = true;
  });
}

async function openLightbox(id) {
  open = id; openRevision = -1;
  $('lightbox').hidden = false;
  $('lightbox').classList.remove('rail-open');   // details hidden by default
  const listedRow = rows.find(r => r.id === id);
  clearStage(listedRow ? !listedRow.artifact.available : true);
  resize();
  $('lb-id').textContent = id;
  const listed = rows.find(r => r.id === id);
  $('lb-created').textContent = listed?.created_at
    ? 'created ' + new Date(listed.created_at).toLocaleString() : '';
  $('lb-download').href = `/v0/characters/${id}/scene.glb`;
  const full = await (await fetch(`/v0/characters/${id}`)).json();
  const character = full.character || {};
  $('lb-prompt').textContent = character.provenance?.prompt || '';
  const writer = character.provenance?.components?.interpreter?.version || '';
  $('lb-writer').textContent = writer && `writer ${writer}`;
  const holder = $('lb-textures');
  holder.innerHTML = '';
  const present = Object.keys(character.textures || {});
  for (const slot of SLOTS.filter(s => present.includes(s))) {
    holder.insertAdjacentHTML('beforeend',
      `<figure><img loading="lazy"
         src="/v0/characters/${id}/assets/${slot}.png?rev=${full.artifact.revision}"
         onerror="this.style.opacity=.15"><figcaption>${slot}</figcaption></figure>`);
  }
  const row = rows.find(r => r.id === id);
  if (row?.artifact.available) loadScene(row);
}
function closeLightbox() { open = null; $('lightbox').hidden = true; }
$('lb-close').onclick = closeLightbox;
$('lb-info').onclick = () => $('lightbox').classList.toggle('rail-open');
addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

async function rebuild(stage) {
  await fetch(`/v0/characters/${open}/rebuild`, { method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ from: stage }) });
  refresh();
}
$('lb-regenerate').onclick = () => rebuild('bake');
$('lb-reassemble').onclick = () => rebuild('assemble');
$('lb-delete').onclick = async () => {
  if (!confirm('Delete this character?')) return;
  await fetch(`/v0/characters/${open}`, { method: 'DELETE' });
  closeLightbox(); refresh();
};

$('stage').appendChild(renderer.domElement);
</script>
</body>
</html>
