<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>character-factory</title>
<style>
/* Gallery-first shell: the library IS the page, the controls are a floating
   dock, one character opens as a lightbox (3D orbit + detail rail). A plain
   client of the /v0 contract — no local-only endpoints. */
:root {
  --bg: #131512; --bar: #1b211e; --tile: #1a1f1c; --lb: #0c0e0d;
  --line: rgba(246,252,249,.09); --line-hard: rgba(246,252,249,.16);
  --fill: rgba(246,252,249,.06);
  --text: #e8efeb; --dim: rgba(232,239,235,.55); --faint: rgba(232,239,235,.35);
  --accent: #4a79e8; --accent-soft: rgba(74,121,232,.22);
  --good: #79c98c; --warn: #d8a55a; --bad: #e6665c;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100dvh; overflow: hidden;
  overscroll-behavior: none; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--sans); }
body { display: flex; flex-direction: column; }
.mono { font-family: var(--mono); font-size: 12px; }
.dim { color: var(--dim); }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--fill); color: var(--text); padding: 6px 14px; }
button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }

/* topbar */
.topbar { display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--line); flex: none; }
.brand { font-weight: 650; letter-spacing: -.01em; }
.brand .mono { margin-left: 10px; color: var(--dim); }

/* gallery */
.gallery-wrap { flex: 1; overflow-y: auto; padding: 16px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px; padding-bottom: 140px; }
.tile { position: relative; aspect-ratio: 3 / 4; border-radius: 12px;
  background: var(--tile) center/cover no-repeat; border: 1px solid var(--line);
  cursor: pointer; overflow: hidden; }
.tile:hover { border-color: var(--line-hard); }
.tile-foot { position: absolute; inset: auto 0 0 0; padding: 28px 9px 7px;
  font-size: 12px; color: var(--text);
  background: linear-gradient(transparent, rgba(0,0,0,.78)); }
.tile-foot .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-badge { position: absolute; top: 8px; left: 8px; padding: 2px 9px;
  border-radius: 999px; font-size: 11px; background: rgba(0,0,0,.55);
  border: 1px solid var(--line-hard); }
.tile-badge.error { color: var(--bad); }
.tile.pending { display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-size: 12px; }
.gallery-empty { text-align: center; color: var(--dim); margin-top: 14vh; }

/* job cards + in-tile progress. Every queued or running job is a card
   in the grid (queued ones ahead of the active one, next-up nearest);
   once a character exists for it the progress moves onto its tile. */
.tile.job { display: flex; flex-direction: column; padding: 9px; cursor: default;
  background: var(--tile); }
.tile.job.queued { border-style: dashed; }
.tile.job.failed, .tile.job.cancelled { border-color: rgba(230,102,92,.35); }
.job-top { display: flex; align-items: center; justify-content: space-between;
  min-height: 22px; margin-bottom: 8px; }
.job-top .tile-badge { position: static; }
.job-prompt { flex: 1; font-size: 12px; line-height: 1.35; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
.job-error { font-size: 11px; color: var(--bad); margin: 4px 0; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.job-retry { padding: 3px 10px; font-size: 12px; margin-top: 6px; align-self: flex-start; }
.spinner { width: 16px; height: 16px; flex: none; border: 2px solid var(--line-hard);
  border-top-color: var(--accent); border-radius: 50%;
  animation: lbspin .9s linear infinite; }
.job-x { position: absolute; top: 6px; right: 6px; z-index: 2; width: 24px; height: 24px;
  padding: 0; border-radius: 50%; font-size: 12px; line-height: 1;
  background: rgba(0,0,0,.55); color: var(--dim); }
.job-x:hover { color: var(--text); border-color: var(--line-hard); }
.steps { display: flex; gap: 3px; margin-top: 6px; }
.step { flex: 1; height: 4px; border-radius: 2px; background: rgba(246,252,249,.14);
  position: relative; overflow: hidden; }
.step.done { background: var(--accent); }
.step.active::after { content: ''; position: absolute; inset: 0; width: 45%;
  border-radius: 2px; background: var(--accent);
  animation: stepslide 1.4s ease-in-out infinite; }
@keyframes stepslide { 0% { left: -45%; } 100% { left: 100%; } }
.step-label { display: flex; justify-content: space-between; gap: 6px;
  font-size: 11px; color: var(--dim); margin-top: 4px; white-space: nowrap; }
.step-label span:first-child { overflow: hidden; text-overflow: ellipsis; }
.tile-foot .steps { margin-top: 4px; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex;
  justify-content: center; padding: 0 16px 18px; pointer-events: none; }
.bar { pointer-events: auto; width: min(760px, 100%); background: var(--bar);
  border: 1px solid var(--line-hard); border-radius: 16px; padding: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,.45); }
.bar-row { display: flex; gap: 8px; align-items: flex-end; }
.bar textarea { flex: 1; resize: none; background: transparent; border: 0;
  outline: none; color: var(--text); font: inherit; max-height: 7em; padding: 6px 4px; }
.chip-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.chip { display: flex; gap: 6px; align-items: center; font-size: 12px;
  color: var(--dim); background: var(--fill); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; }
.chip select { background: transparent; color: var(--text); border: 0;
  outline: none; font: inherit; font-size: 12px; }
.chip select option { background: var(--bar); }
.bar-note { font-size: 12px; color: var(--dim); min-height: 16px; margin-left: auto; }

/* lightbox */
.lightbox { position: fixed; inset: 0; background: var(--lb); display: flex; z-index: 30; }
.lb-stage { flex: 1; position: relative; min-width: 0; }
.lb-stage canvas { display: block; }
.lb-close { position: absolute; top: 12px; left: 12px; z-index: 2; }
.lb-info { position: absolute; top: 12px; right: 12px; z-index: 2; }
.lb-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  color: var(--faint); }
.lb-spinner { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px;
  margin: -21px 0 0 -21px; border: 3px solid var(--line);
  border-top-color: var(--accent); border-radius: 50%; z-index: 1;
  animation: lbspin .9s linear infinite; }
@keyframes lbspin { to { transform: rotate(360deg); } }
/* The detail rail is hidden by default (toggled by the ⓘ button); on
   narrow screens it overlays the stage instead of squeezing it away. */
.lb-rail { width: 330px; flex: none; border-left: 1px solid var(--line);
  padding: 14px; display: none; flex-direction: column; gap: 10px;
  overflow-y: auto; background: var(--bg); }
.lightbox.rail-open .lb-rail { display: flex; }
@media (max-width: 700px) {
  .lb-rail { position: absolute; top: 0; right: 0; bottom: 0;
    width: min(330px, 88vw); z-index: 4; box-shadow: -12px 0 30px rgba(0,0,0,.5); }
}
.lb-prompt { color: var(--dim); font-size: 13px; margin: 0; }
.lb-textures { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lb-textures figure { margin: 0; text-align: center; }
.lb-textures img { width: 100%; aspect-ratio: 1; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--line); background: #000; }
.lb-textures figcaption { font-size: 11px; color: var(--dim); margin-top: 2px; }
.lb-flex { flex: 1; }
.lb-actions { display: flex; flex-direction: column; gap: 8px; }
.lb-actions a { text-align: center; text-decoration: none; color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px;
  background: var(--fill); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">character-factory
    <span class="mono" id="worker-status">connecting…</span></div>
  <div class="mono dim"><span id="library-count"></span>
    <a href="/v0/docs" style="color: inherit; margin-left: 12px;">API docs</a></div>
</header>

<main class="gallery-wrap">
  <div class="gallery" id="grid"></div>
  <div class="gallery-empty" id="empty" hidden>
    <h2>Nothing here yet</h2>
    <p>Describe a character below and create. They land here as they build.</p>
  </div>
</main>

<div class="dock"><div class="bar">
  <div class="bar-row">
    <textarea id="prompt" rows="1"
      placeholder="a tall athletic woman with long wavy red hair and green eyes, wearing a navy tank top and black leggings"></textarea>
    <button class="primary" id="create">Create</button>
  </div>
  <div class="chip-row">
    <label class="chip">writer
      <select id="interpreter"><option value="">auto</option></select>
    </label>
    <label class="chip" title="Bake textures on the fast distilled base — speed over fidelity">
      <input type="checkbox" id="turbo"> turbo
    </label>
    <span class="bar-note" id="note"></span>
  </div>
</div></div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-stage" id="stage">
    <button class="lb-close" id="lb-close">✕ close</button>
    <button class="lb-info" id="lb-info">ⓘ details</button>
    <div class="lb-spinner" id="lb-spinner" hidden></div>
    <div class="lb-hint mono">drag to orbit · scroll to zoom</div>
  </div>
  <aside class="lb-rail">
    <div class="mono" id="lb-id"></div>
    <div class="mono dim" id="lb-status"></div>
    <div class="mono dim" id="lb-created"></div>
    <p class="lb-prompt" id="lb-prompt"></p>
    <div class="mono dim" id="lb-writer"></div>
    <details open><summary class="mono dim">generated UV maps</summary>
      <div class="lb-textures" id="lb-textures"></div></details>
    <div class="lb-flex"></div>
    <div class="lb-actions">
      <a id="lb-download" download>Download scene.glb</a>
      <button id="lb-regenerate">Regenerate (re-bake textures)</button>
      <button id="lb-reassemble">Reassemble</button>
      <button class="danger" id="lb-delete">Delete</button>
    </div>
  </aside>
</div>

<script>
/* The orbit viewer is an enhancement loaded below. If its modules are not
   reachable (for example on an offline private deployment), keep the
   library and create workflow usable with this dependency-free fallback. */
setTimeout(async () => {
  if (window.characterFactoryUiReady) return;
  const byId = id => document.getElementById(id);
  byId('worker-status').textContent = 'basic offline view';
  const rows = await fetch('/v0/characters').then(r => r.json())
    .catch(() => []);
  const grid = byId('grid');
  grid.replaceChildren(...rows.map(row => {
    const tile = document.createElement(row.artifact.available ? 'a' : 'div');
    tile.className = 'tile pending';
    tile.textContent = `${row.name || row.id} — ${row.artifact.available ? 'download GLB' : 'stored'}`;
    if (row.artifact.available) tile.href = `/v0/characters/${row.id}/scene.glb`;
    return tile;
  }));
  byId('empty').hidden = rows.length > 0;
  byId('library-count').textContent = `${rows.length} characters`;
  fetch('/v0/interpreters').then(r => r.json()).then(items => {
    for (const item of items) {
      const option = document.createElement('option');
      option.value = item.alias; option.textContent = item.alias;
      byId('interpreter').appendChild(option);
    }
  }).catch(() => {});
  byId('create').onclick = async () => {
    const prompt = byId('prompt').value.trim();
    if (!prompt) return;
    const body = {prompt};
    if (byId('interpreter').value) body.interpreter = byId('interpreter').value;
    if (byId('turbo').checked) body.turbo = true;
    const response = await fetch('/v0/characters', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const result = await response.json();
    byId('note').textContent = response.ok ? `queued job ${result.id}`
      : (result.error || 'failed');
  };
}, 1500);
</script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
} }
</script>
<script type="module">
window.characterFactoryUiReady = true;
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const SLOTS = ['skin', 'garment', 'shoe', 'eye'];

let rows = [], jobs = [], open = null, openRevision = -1;

/* ------------------------------------------------------------- selector */
fetch('/v0/interpreters').then(r => r.json()).then(list => {
  for (const {alias, kind} of list) {
    const option = document.createElement('option');
    option.value = alias;
    option.textContent = kind === 'rules' ? `${alias} (fallback)` : alias;
    $('interpreter').appendChild(option);
  }
}).catch(() => {});

/* ------------------------------------------------------------------ jobs */
// The stages each operation walks (the server's job.stage values, in order).
const STAGES = { create: ['creating', 'baking', 'assembling'],
                 bake: ['baking', 'assembling'], assemble: ['assembling'] };
const STAGE_LABEL = { creating: 'writing the recipe', baking: 'baking textures',
                      assembling: 'assembling the GLB', complete: 'done' };
const active = job => ['queued', 'running', 'cancelling'].includes(job?.status);
const mmss = seconds => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
const since = iso => iso ? mmss(Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000))) : '';

// Step-by-step progress: one segment per stage, done ones solid, the
// current one sweeping (stages report no inner progress — the sweep plus
// the running stage clock is what shows the job is alive).
function stepsMarkup(job) {
  const steps = STAGES[job.operation] || ['assembling'];
  const at = steps.indexOf(job.stage);
  const running = job.status === 'running' || job.status === 'cancelling';
  const segments = steps.map((_, i) => {
    const cls = job.status === 'succeeded' || (running && i < at) ? 'done'
              : running && i === at ? 'active' : '';
    return `<span class="step ${cls}"></span>`;
  }).join('');
  let label;
  if (job.status === 'queued') label = job.queue_position ? `queued · #${job.queue_position}` : 'queued';
  else if (job.status === 'submitting') label = 'submitting…';
  else if (job.status === 'cancelling') label = 'cancelling after this stage…';
  else if (running) label = `${STAGE_LABEL[job.stage] || job.stage} · ${since(job.stage_started_at)}`;
  else label = job.status;
  const count = running && at >= 0 ? `${at + 1}/${steps.length}` : '';
  return `<div class="steps">${segments}</div>` +
         `<div class="step-label"><span>${esc(label)}</span><span>${count}</span></div>`;
}

// Dismissed terminal job cards (failed creates that never produced a
// character) — per browser, best effort.
const DISMISSED_KEY = 'cf-dismissed-jobs';
function dismissed() {
  try { return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY) || '[]')); }
  catch { return new Set(); }
}
function dismiss(id) {
  try {
    const set = dismissed(); set.add(id);
    localStorage.setItem(DISMISSED_KEY, JSON.stringify([...set].slice(-200)));
  } catch {}
}

async function cancelJob(job) {
  await fetch(`/v0/jobs/${job.id}`, { method: 'DELETE' }).catch(() => {});
  refresh();
}
function cancelButton(job) {
  const title = !active(job) ? 'dismiss' : job.status === 'queued' ? 'remove from queue'
              : job.status === 'cancelling' ? 'cancelling…' : 'cancel';
  return `<button class="job-x" title="${title}" ${job.status === 'cancelling' ? 'disabled' : ''}>✕</button>`;
}

// A card for a job with no character tile yet (a create before its
// recipe exists, or one that failed before it did).
function jobCard(job) {
  const div = document.createElement('div');
  div.className = `tile job ${job.status}`;
  const terminal = !active(job) && job.status !== 'submitting';
  const head = job.status === 'queued'
    ? `<span class="tile-badge">queued${job.queue_position ? ' #' + job.queue_position : ''}</span>`
    : terminal ? `<span class="tile-badge error">${esc(job.status)}</span>`
    : '<span class="spinner"></span>';
  const what = job.request?.prompt || (job.request?.character_id ? `rebuild ${job.request.character_id}` : '');
  div.innerHTML =
    `<div class="job-top">${head}</div>${job.status === 'submitting' ? '' : cancelButton(job)}
     <div class="job-prompt" title="${esc(what)}">${esc(what)}</div>
     ${terminal && job.error ? `<div class="job-error">${esc(job.error.message)}</div>` : ''}
     ${stepsMarkup(job)}
     ${terminal && job.error?.retryable !== false ? '<button class="job-retry">retry</button>' : ''}`;
  const x = div.querySelector('.job-x');
  if (x) x.onclick = e => {
    e.stopPropagation();
    if (terminal) { dismiss(job.id); refresh(); } else cancelJob(job);
  };
  const retry = div.querySelector('.job-retry');
  if (retry) retry.onclick = async e => {
    e.stopPropagation();
    retry.disabled = true;
    const response = await fetch(`/v0/jobs/${job.id}/retry`, { method: 'POST' }).catch(() => null);
    if (response?.ok) dismiss(job.id);
    refresh();
  };
  return div;
}

/* --------------------------------------------------------------- gallery */
function tile(row) {
  const div = document.createElement('div');
  const job = row.latest_job;
  const working = active(job);
  const failed = job?.status === 'failed';
  if (row.artifact.available || failed || working) {
    div.className = 'tile';
    // The rendered portrait, written by the server when assembly completes
    // (a 404 for not-yet-thumbnailed characters just leaves the tile card).
    div.style.backgroundImage =
      `url(/v0/characters/${row.id}/thumbnail.png?rev=${row.artifact.revision})`;
  } else {
    div.className = 'tile pending';
    div.textContent = 'stored';
  }
  const badge = failed
    ? `<span class="tile-badge error" title="${esc(job.error?.message)}">error</span>`
    : working ? `<span class="tile-badge">${job.status === 'queued' ? 'queued' : 'working'}</span>` : '';
  div.insertAdjacentHTML('beforeend',
    `${badge}${working ? cancelButton(job) : ''}<div class="tile-foot">` +
    `<div class="name">${esc(row.name || row.id)}</div>${working ? stepsMarkup(job) : ''}</div>`);
  const x = div.querySelector('.job-x');
  if (x) x.onclick = e => { e.stopPropagation(); cancelJob(job); };
  div.onclick = () => openLightbox(row.id);
  return div;
}

// Grid order: queued jobs first (next-up nearest the active one), then
// whatever is running, then failed creates awaiting a decision, then the
// library newest-first. A job whose character already exists is shown on
// that character's tile, not as a separate card.
let submitting = [];   // optimistic cards between click and the server's ack
function gridChildren() {
  const onTiles = new Set(rows.map(r => r.latest_job?.id).filter(Boolean));
  const hidden = dismissed();
  const orphan = jobs.filter(j => !onTiles.has(j.id));
  // Live work, cards and tiles alike: queued entries first, the one that
  // runs next closest to the running one.
  const live = [
    ...orphan.filter(active).map(j => ({ job: j, node: () => jobCard(j) })),
    ...rows.filter(r => active(r.latest_job))
           .map(r => ({ job: r.latest_job, node: () => tile(r) })),
  ];
  const key = j => j.status === 'queued' ? (j.queue_position || 0) : -1;
  live.sort((a, b) => key(b.job) - key(a.job));
  const dayAgo = Date.now() - 86400e3;
  const failed = orphan.filter(j => j.operation === 'create'
    && ['failed', 'cancelled'].includes(j.status) && !hidden.has(j.id)
    && Date.parse(j.finished_at || j.updated_at || 0) > dayAgo);
  const restRows = rows.filter(r => !active(r.latest_job));
  return [
    ...submitting.map(jobCard), ...live.map(entry => entry.node()),
    ...failed.map(jobCard), ...restRows.map(tile),
  ];
}

async function refresh() {
  try {
    [rows, jobs] = await Promise.all([
      fetch('/v0/characters').then(r => r.json()),
      fetch('/v0/jobs').then(r => r.json()),
    ]);
  }
  catch { $('worker-status').textContent = 'server unreachable'; return; }
  const live = jobs.filter(active);
  const busy = live.find(j => j.status !== 'queued');
  const waiting = live.length - (busy ? 1 : 0);
  $('worker-status').textContent = busy
    ? `${STAGE_LABEL[busy.stage] || busy.stage}${waiting ? ` · ${waiting} queued` : ''}`
    : waiting ? `${waiting} queued` : 'idle';
  $('library-count').textContent = rows.length ? `${rows.length} characters` : '';
  const children = gridChildren();
  $('grid').replaceChildren(...children);
  $('empty').hidden = children.length > 0;
  if (open) {
    const row = rows.find(r => r.id === open);
    if (row) {
      const job = row.latest_job;
      $('lb-status').textContent = job
        ? job.stage + (job.detail ? ` — ${job.detail}` : '')
        : row.artifact.available ? 'ready' : 'stored';
      if (row.artifact.available && row.artifact.revision !== openRevision) loadScene(row);
    }
  }
}
setInterval(refresh, 1500); refresh();

/* ---------------------------------------------------------------- create */
$('create').onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) return;
  const body = { prompt };
  if ($('interpreter').value) body.interpreter = $('interpreter').value;
  if ($('turbo').checked) body.turbo = true;
  // The card appears the moment Create is pressed; the server's job record
  // replaces it on the next refresh (or the card goes away on a refusal).
  const placeholder = { id: `pending-${Date.now()}`, operation: 'create',
                        status: 'submitting', stage: 'queued', request: body };
  submitting.push(placeholder);
  $('grid').replaceChildren(...gridChildren());
  $('empty').hidden = true;
  $('create').disabled = true;
  $('note').textContent = '';
  try {
    const response = await fetch('/v0/characters', { method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    const record = await response.json();
    if (response.ok) $('prompt').value = '';
    else $('note').textContent = record.error || record.detail || 'failed';
  } catch (error) { $('note').textContent = String(error); }
  submitting = submitting.filter(j => j !== placeholder);
  $('create').disabled = false;
  refresh();
};

/* -------------------------------------------------------------- lightbox */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0e0d);
scene.environment = new THREE.PMREMGenerator(renderer)
  .fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.GridHelper(3, 12, 0x3a3f47, 0x22252b));
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
camera.position.set(1.3, 1.5, 2.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
let mixer = null, model = null;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if ($('lightbox').hidden) return;
  if (mixer) mixer.update(clock.getDelta());
  controls.update(); renderer.render(scene, camera);
});
function resize() {
  const stage = $('stage');
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('stage'));

// Never show the previously loaded character while a new one downloads:
// the stage is cleared immediately and a spinner holds it until the right
// scene arrives (the token drops loads that finish out of order).
let loadToken = 0;
function clearStage(spinning) {
  if (model) { scene.remove(model); model = null; }
  mixer = null;
  $('lb-spinner').hidden = !spinning;
}
function loadScene(row) {
  openRevision = row.artifact.revision;
  const token = ++loadToken;
  clearStage(true);
  new GLTFLoader().load(`/v0/characters/${row.id}/scene.glb?rev=${row.artifact.revision}`, g => {
    if (token !== loadToken || open !== row.id) return;   // stale load
    model = g.scene; scene.add(model);
    mixer = new THREE.AnimationMixer(model);
    g.animations.forEach(c => mixer.clipAction(c).play());  // the baked idle
    $('lb-spinner').hidden = true;
  });
}

async function openLightbox(id) {
  open = id; openRevision = -1;
  $('lightbox').hidden = false;
  $('lightbox').classList.remove('rail-open');   // details hidden by default
  const listedRow = rows.find(r => r.id === id);
  clearStage(listedRow ? !listedRow.artifact.available : true);
  resize();
  $('lb-id').textContent = id;
  const listed = rows.find(r => r.id === id);
  $('lb-created').textContent = listed?.created_at
    ? 'created ' + new Date(listed.created_at).toLocaleString() : '';
  $('lb-download').href = `/v0/characters/${id}/scene.glb`;
  const full = await (await fetch(`/v0/characters/${id}`)).json();
  const character = full.character || {};
  $('lb-prompt').textContent = character.provenance?.prompt || '';
  const writer = character.provenance?.components?.interpreter?.version || '';
  $('lb-writer').textContent = writer && `writer ${writer}`;
  const holder = $('lb-textures');
  holder.innerHTML = '';
  const present = Object.keys(character.textures || {});
  for (const slot of SLOTS.filter(s => present.includes(s))) {
    holder.insertAdjacentHTML('beforeend',
      `<figure><img loading="lazy"
         src="/v0/characters/${id}/assets/${slot}.png?rev=${full.artifact.revision}"
         onerror="this.style.opacity=.15"><figcaption>${slot}</figcaption></figure>`);
  }
  const row = rows.find(r => r.id === id);
  if (row?.artifact.available) loadScene(row);
}
function closeLightbox() { open = null; $('lightbox').hidden = true; }
$('lb-close').onclick = closeLightbox;
$('lb-info').onclick = () => $('lightbox').classList.toggle('rail-open');
addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

async function rebuild(stage) {
  await fetch(`/v0/characters/${open}/rebuild`, { method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ from: stage }) });
  refresh();
}
$('lb-regenerate').onclick = () => rebuild('bake');
$('lb-reassemble').onclick = () => rebuild('assemble');
$('lb-delete').onclick = async () => {
  if (!confirm('Delete this character?')) return;
  await fetch(`/v0/characters/${open}`, { method: 'DELETE' });
  closeLightbox(); refresh();
};

$('stage').appendChild(renderer.domElement);
</script>
</body>
</html>
